# Render Blueprint (brief §21): one Node web service for the Colyseus server and
# one static site for the client, both auto-deployed from main.
# Field names follow Render's Blueprint spec as I know it; they could not be
# checked against the live docs from the build environment (see docs/DECISIONS.md).
services:
  - type: web
    name: the-museum-server
    runtime: node
    plan: free            # use a paid plan for real play sessions (no sleep, see README)
    rootDir: .
    buildCommand: npm ci && npm run build -w shared && npm run build -w server
    startCommand: npm run start -w server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # CORS allowlist: the client's public URL (comma-separate several). Change
      # it here or in the dashboard if the static site's URL differs.
      - key: CLIENT_ORIGIN
        value: https://the-museum-client.onrender.com

  - type: web
    name: the-museum-client
    runtime: static
    buildCommand: npm ci && npm run build -w client
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # so /party/<slug> loads the app
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The server's PUBLIC URL. (fromService "host" is the private-network
      # hostname, which browsers cannot reach, so it is set explicitly.)
      # Change it here or in the dashboard if the server's URL differs.
      - key: VITE_SERVER_URL
        value: https://the-museum-server.onrender.com
